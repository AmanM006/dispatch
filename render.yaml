services:
  - type: web
    name: dispatch-sentinel
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn dispatch.twin_server:app --host 0.0.0.0 --port $PORT --workers 1
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: PYTHONPATH
        value: /opt/render/project/src
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
    healthCheckPath: /api/state
